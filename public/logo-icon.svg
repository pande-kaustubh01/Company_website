<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00C2FF" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Group for Circuit Elements (Electric Cyan #00C2FF) -->
  <g stroke="#00C2FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Outer Quadrant Arcs -->
    <!-- Top-Left Outer Arc -->
    <path d="M 68 180 A 136 136 0 0 1 180 68" />
    <!-- Top-Right Outer Arc -->
    <path d="M 220 68 A 136 136 0 0 1 332 180" />
    <!-- Bottom-Right Outer Arc -->
    <path d="M 332 220 A 136 136 0 0 1 220 332" />
    <!-- Bottom-Left Outer Arc -->
    <path d="M 180 332 A 136 136 0 0 1 68 220" />

    <!-- Crosshair Axis Dividers -->
    <line x1="50" y1="200" x2="148" y2="200" stroke-width="5.5" />
    <line x1="252" y1="200" x2="350" y2="200" stroke-width="5.5" />
    <line x1="200" y1="50" x2="200" y2="148" stroke-width="5.5" />
    <line x1="200" y1="252" x2="200" y2="350" stroke-width="5.5" />

    <!-- TOP-LEFT QUADRANT (Q2) TRACES -->
    <!-- Inner track -->
    <path d="M 175 145 A 60 60 0 0 0 145 175" />
    <!-- Middle track 1 with angled lead & dot -->
    <path d="M 185 115 A 90 90 0 0 0 115 185" />
    <path d="M 148 120 L 125 97" />
    <!-- Middle track 2 -->
    <path d="M 160 90 A 115 115 0 0 0 90 160" />
    <path d="M 90 160 L 65 160" />
    <path d="M 105 130 L 80 115" />

    <!-- TOP-RIGHT QUADRANT (Q1) TRACES -->
    <!-- Inner track with 90 deg bend & dot -->
    <path d="M 225 145 A 60 60 0 0 1 255 175" />
    <!-- Middle track with 45 deg jog -->
    <path d="M 215 115 A 90 90 0 0 1 285 185" />
    <path d="M 245 130 L 275 130" />
    <path d="M 275 130 L 295 150" />
    <!-- Outer track -->
    <path d="M 240 90 A 115 115 0 0 1 310 160" />
    <path d="M 290 100 L 315 120" />

    <!-- BOTTOM-LEFT QUADRANT (Q3) TRACES -->
    <!-- Inner track -->
    <path d="M 145 225 A 60 60 0 0 0 175 255" />
    <!-- Middle track 1 with step down -->
    <path d="M 115 215 A 90 90 0 0 0 185 285" />
    <path d="M 130 245 L 105 245" />
    <path d="M 105 245 L 85 265" />
    <!-- Outer track -->
    <path d="M 90 240 A 115 115 0 0 0 160 310" />
    <path d="M 120 290 L 95 315" />

    <!-- BOTTOM-RIGHT QUADRANT (Q4) TRACES -->
    <!-- Inner track -->
    <path d="M 255 225 A 60 60 0 0 1 225 255" />
    <!-- Middle track with jog -->
    <path d="M 285 215 A 90 90 0 0 1 215 285" />
    <path d="M 255 270 L 275 295" />
    <path d="M 270 255 L 305 255" />
    <!-- Outer track -->
    <path d="M 310 240 A 115 115 0 0 1 240 310" />
    <path d="M 290 300 L 310 280" />
  </g>

  <!-- Circuit Terminal Nodes / Dots (Cyan filled #00C2FF) -->
  <g fill="#00C2FF">
    <!-- Top-Left Dots -->
    <circle cx="125" cy="97" r="7" />
    <circle cx="80" cy="115" r="7" />
    <circle cx="65" cy="160" r="7" />
    <circle cx="180" cy="85" r="6" />

    <!-- Top-Right Dots -->
    <circle cx="295" cy="150" r="7" />
    <circle cx="315" cy="120" r="7" />
    <circle cx="270" cy="90" r="6.5" />
    <circle cx="325" cy="155" r="6" />

    <!-- Bottom-Left Dots -->
    <circle cx="85" cy="265" r="7" />
    <circle cx="95" cy="315" r="7" />
    <circle cx="140" cy="315" r="6.5" />
    <circle cx="75" cy="225" r="6" />

    <!-- Bottom-Right Dots -->
    <circle cx="275" cy="295" r="7" />
    <circle cx="305" cy="255" r="7" />
    <circle cx="310" cy="280" r="7" />
    <circle cx="250" cy="325" r="6.5" />
  </g>

  <!-- Center Hub Ring -->
  <circle cx="200" cy="200" r="50" fill="#000000" stroke="#00C2FF" stroke-width="5.5" />

  <!-- Center Letter 'D' -->
  <text 
    x="200" 
    y="219" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="54" 
    font-weight="900" 
    fill="#FFFFFF" 
    text-anchor="middle"
  >D</text>
</svg>
